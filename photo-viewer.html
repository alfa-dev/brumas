<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="creator" content="Rafael Lopes · Alfa Dev (alfadevtecnologia@gmail.com)">
  <link rel="author" href="https://x.com/alfa_dev">
  <title>Brumas - Visualizar Foto</title>
  <meta name="robots" content="noindex, follow">

  <link rel="stylesheet" href="css/styles.css?v=8255059">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&family=Gentium+Book+Plus:ital@0;1&display=swap"
    rel="stylesheet">

</head>
<body class="pv-body">
  <video muted loop playsinline preload="none" data-lazy-video id="bg-video" poster="videos/poster-v2.jpg?v=8255059">
    <source data-src="videos/bg-v2.mp4?v=8255059" type="video/mp4">
  </video>
  <div class="photo-viewer">
    <div class="pv-topbar">
      <a href="#" onclick="window.history.back(); return false;" class="pv-icon-button" aria-label="Voltar">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <p class="pv-eyebrow">Galeria · Brumas Festival 2025</p>
      <a href="index.html#galeria" class="pv-icon-button" aria-label="Fechar">
        <i class="fa-solid fa-xmark"></i>
      </a>
    </div>

    <div class="pv-stage">
      <figure class="pv-frame is-empty" id="photo-frame">
        <img id="photo" alt="">
        <span class="pv-loader" aria-hidden="true"></span>
      </figure>
    </div>

    <div class="pv-footer">
      <h1 class="pv-title" id="photo-title"></h1>
      <div class="pv-nav">
        <button class="pv-icon-button" id="prev-button" aria-label="Foto anterior">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span class="pv-counter" id="photo-counter"></span>
        <button class="pv-icon-button" id="next-button" aria-label="Próxima foto">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    const photo = document.getElementById('photo');
    const photoTitleElement = document.getElementById('photo-title');
    const prevButton = document.getElementById('prev-button');
    const nextButton = document.getElementById('next-button');
    const photoCounter = document.getElementById('photo-counter');

    function updateButtons() {
      if (isFirstPhoto()) prevButton.setAttribute('disabled', 'disabled');
      else prevButton.removeAttribute('disabled');

      if (isLastPhoto()) nextButton.setAttribute('disabled', 'disabled');
      else nextButton.removeAttribute('disabled');
    }

    function getPhotoId() {
      const urlParams = new URLSearchParams(window.location.search);
      return parseInt(urlParams.get('id'));
    }

    function getCurrentPhoto() {
      return PHOTOS.find(p => p.id === getPhotoId());
    }

    // Troca de foto: mostra o carregamento, espera a imagem estar pronta (decodificada) e só então troca
    // foto, título e contador juntos, animando o tamanho da moldura (300ms).
    const frame = document.getElementById('photo-frame');
    const RESIZE_MS = 300;
    const cache = new Map();
    let requestToken = 0;

    function preload(src) {
      if (!cache.has(src)) {
        const img = new Image();
        img.src = src;
        cache.set(src, (img.decode ? img.decode() : new Promise((ok, err) => { img.onload = ok; img.onerror = err; })).catch(() => {}));
      }
      return cache.get(src);
    }

    function preloadNeighbors(id) {
      [id - 1, id + 1].forEach(n => {
        const p = PHOTOS.find(photo => photo.id === n);
        if (p) preload(p.src);
      });
    }

    async function updatePhoto() {
      const currentPhoto = getCurrentPhoto();
      if (!currentPhoto) return;
      const token = ++requestToken;

      // Só mostra o loader se a imagem demorar (evita piscar quando já está em cache)
      const loaderTimer = setTimeout(() => frame.classList.add('is-loading'), 120);
      await preload(currentPhoto.src);
      clearTimeout(loaderTimer);
      if (token !== requestToken) return; // o usuário já pediu outra foto

      const animate = !frame.classList.contains('is-empty') &&
        !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const from = frame.getBoundingClientRect();

      frame.style.width = '';
      frame.style.height = '';
      frame.classList.remove('is-resizing');
      photo.src = currentPhoto.src;
      photo.alt = currentPhoto.title;
      photoTitleElement.textContent = currentPhoto.title;
      photoCounter.textContent = `${String(currentPhoto.id).padStart(2, '0')} / ${PHOTOS.length}`;
      frame.classList.remove('is-loading', 'is-empty');

      if (animate) {
        const to = frame.getBoundingClientRect();
        if (Math.abs(to.width - from.width) > 1 || Math.abs(to.height - from.height) > 1) {
          frame.style.width = `${from.width}px`;
          frame.style.height = `${from.height}px`;
          frame.classList.add('is-resizing');
          frame.offsetWidth; // aplica o tamanho antigo antes de animar
          frame.style.width = `${to.width}px`;
          frame.style.height = `${to.height}px`;
          setTimeout(() => {
            if (token !== requestToken) return;
            frame.classList.remove('is-resizing');
            frame.style.width = '';
            frame.style.height = '';
          }, RESIZE_MS + 30);
        }
      }

      preloadNeighbors(currentPhoto.id);
    }

    function isFirstPhoto() {
      return getPhotoId() === 1;
    }

    function isLastPhoto() {
      return getPhotoId() === PHOTOS.length;
    }

    function navigatePhoto(direction) {
      let currentIndex = getPhotoId();

      if      (direction === 'prev' && !isFirstPhoto()) currentIndex--;
      else if (direction === 'next' && !isLastPhoto()) currentIndex++;
      else return;

      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('id', currentIndex);
      window.history.pushState({}, '', newUrl);

      updatePhoto();
      updateButtons();
    }

    // navigate if push state
    window.addEventListener('popstate', (e) => {
      updatePhoto();
      updateButtons();
    });

    prevButton.addEventListener('click', () => navigatePhoto('prev'));
    nextButton.addEventListener('click', () => navigatePhoto('next'));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        navigatePhoto('prev');
      } else if (e.key === 'ArrowRight') {
        navigatePhoto('next');
      } else if (e.key === 'Escape') {
        window.location.href = 'index.html#galeria';
      }
    });

    updatePhoto();
    updateButtons();
  </script>

  <!-- Carregado só depois do "load" para não competir com o carregamento da página -->

</body>
</html>
