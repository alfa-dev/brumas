<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brumas - Visualizar Foto</title>
  <meta name="robots" content="noindex, follow">

  <link rel="stylesheet" href="css/styles.css?v=5fc7175">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&family=Gentium+Book+Plus:ital@0;1&display=swap"
    rel="stylesheet">

  <script src="js/script.js?v=5fc7175"></script>

  <link rel="stylesheet" href="css/sections/photo-viewer.css?v=5fc7175">
</head>
<body class="pv-body">
  <video autoplay muted loop playsinline id="bg-video" poster="videos/poster.png">
    <source src="videos/bg.mp4" type="video/mp4">
  </video>
  <div class="photo-viewer">
    <div class="pv-topbar">
      <a href="#" onclick="window.history.back(); return false;" class="pv-icon-button" aria-label="Voltar">
        <i class="fa-solid fa-arrow-left"></i>
      </a>
      <p class="pv-eyebrow">Galeria · Brumas Festival 2025</p>
      <a href="index.html#galeria" class="pv-icon-button" aria-label="Fechar">
        <i class="fa-solid fa-xmark"></i>
      </a>
    </div>

    <div class="pv-stage">
      <figure class="pv-frame">
        <img id="photo" src="" alt="" style="view-transition-name: 'gallery-item';">
      </figure>
    </div>

    <div class="pv-footer">
      <h1 class="pv-title" id="photo-title"></h1>
      <div class="pv-nav">
        <button class="pv-icon-button" id="prev-button" aria-label="Foto anterior">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
        <span class="pv-counter" id="photo-counter"></span>
        <button class="pv-icon-button" id="next-button" aria-label="Próxima foto">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
    const photo = document.getElementById('photo');
    const photoTitleElement = document.getElementById('photo-title');
    const prevButton = document.getElementById('prev-button');
    const nextButton = document.getElementById('next-button');
    const photoCounter = document.getElementById('photo-counter');

    updatePhoto();
    updateButtons();

    function updateButtons() {
      if (isFirstPhoto()) prevButton.setAttribute('disabled', 'disabled');
      else prevButton.removeAttribute('disabled');

      if (isLastPhoto()) nextButton.setAttribute('disabled', 'disabled');
      else nextButton.removeAttribute('disabled');
    }

    function getPhotoId() {
      const urlParams = new URLSearchParams(window.location.search);
      return parseInt(urlParams.get('id'));
    }

    function getCurrentPhoto() {
      return PHOTOS.find(p => p.id === getPhotoId());
    }

    function updatePhoto() {
      const currentPhoto = getCurrentPhoto();

      photo.src = currentPhoto.src;
      photo.alt = currentPhoto.title;
      photoTitleElement.textContent = currentPhoto.title;
      photoCounter.textContent = `${String(currentPhoto.id).padStart(2, '0')} / ${PHOTOS.length}`;
    }

    function isFirstPhoto() {
      return getPhotoId() === 1;
    }

    function isLastPhoto() {
      return getPhotoId() === PHOTOS.length;
    }

    function navigatePhoto(direction) {
      let currentIndex = getPhotoId();

      if      (direction === 'prev' && !isFirstPhoto()) currentIndex--;
      else if (direction === 'next' && !isLastPhoto()) currentIndex++;
      else return;

      const newUrl = new URL(window.location.href);
      newUrl.searchParams.set('id', currentIndex);
      window.history.pushState({}, '', newUrl);

      updatePhoto();
      updateButtons();
    }

    // navigate if push state
    window.addEventListener('popstate', (e) => {
      updatePhoto();
      updateButtons();
    });

    prevButton.addEventListener('click', () => navigatePhoto('prev'));
    nextButton.addEventListener('click', () => navigatePhoto('next'));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') {
        navigatePhoto('prev');
      } else if (e.key === 'ArrowRight') {
        navigatePhoto('next');
      } else if (e.key === 'Escape') {
        window.location.href = 'index.html#galeria';
      }
    });
  </script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-DL5KF46QH2"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-DL5KF46QH2');
  </script>
</body>
</html>
